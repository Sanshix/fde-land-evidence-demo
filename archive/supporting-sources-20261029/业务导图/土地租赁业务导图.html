.form-select:focus-visible {

.form-check {

.form-check:not(.form-switch)

  width: 100%;
  height: 100%;
  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
  background-color: var(--foreground);
}
.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:indeterminate::before {
  position: absolute;
  inset: 0;
  display: block;
  width: 65%;
  height: 6.65%;
  margin: auto;
  border-radius: var(--radius-full);
  background: var(--foreground);
  mask: none;
  content: "";
}

.form-check-input[type="radio"] {
  border-radius: var(--radius-full);
  width: 16px;
  height: 16px;
  border: 0;
  box-shadow: inset 0 0 0 1px var(--input);
}

  box-shadow: 0 0 0 2px var(--ring);
}

.form-check:not(.form-switch) .form-check-input:disabled {

}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}
.form-check:not(.form-switch) .form-check-input[type="radio"]:disabled,
.form-check:not(.form-switch)

}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

.form-switch .form-check-input::before {

.form-switch .form-check-input:checked {

.btn:not(.btn-primary, .viz-tile):is(

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {

  }

html{color-scheme:light!important;background:#fff!important}body{margin:0;padding:28px;background:#fff;color:#20252b;font-family:LeaseMap,sans-serif}#lease-map{width:960px;max-width:none;margin:0 auto}body{min-width:1016px;box-sizing:border-box}*{box-sizing:border-box}:root{--background:#fff;--foreground:#20252b;--border:#dce1e7;--muted-foreground:#606974;--viz-series-1:#247a72;--primary:#20252b;--primary-foreground:#fff}button{font-family:inherit!important}</style><link rel="icon" href="data:,"/></head><body><div id="lease-map">

<style>

<script>
(()=>{const root=document.getElementById('lease-map');const data={
evidence:[['合同材料','新签、续期、变更协议及宗地图。'],['基础数据','登记信息、缴费记录、批准减免与计租标准。'],['证据保留','原件哈希、页面引用；支持补件与合并文书。']],

rent:[['计算应缴','固定租金或面积乘标准，按年分段、按月折算及减免。'],['分配实缴','票据去重；指定年度记该年，未指定优先抵扣早年。'],['异常处理','存疑列算法及差额；付款未确认时不能视为零。']],
events:[['新签与续期','按模板生成草稿，仍须确认归档。'],['收款与终止','上传依据，预览影响，确认后重算台账。'],['标准调整','比较新旧规则，确认后重算并保留差异。']],
output:[['提醒与催缴','到期、欠缴分级；通知书审核及发送记录。短信默认模拟。'],['查询与统计','台账、问题清单、收缴率、街路统计及日历导出。'],['文书与模板','税务推送单生成留档；合同和通知模板导入、恢复。']]};
const detail=root.querySelector('.detail');let selected=null;
root.querySelectorAll('.branch').forEach(b=>{b.setAttribute('aria-expanded','false');b.addEventListener('click',()=>{selected=selected===b.dataset.key?null:b.dataset.key;root.querySelectorAll('.branch').forEach(x=>{x.setAttribute('aria-expanded',String(x.dataset.key===selected));x.setAttribute('aria-pressed',String(x.dataset.key===selected))});detail.hidden=!selected;detail.replaceChildren();if(selected)data[selected].forEach(([a,t])=>{let el=document.createElement('div'),h=document.createElement('strong'),p=document.createElement('p');h.textContent=a;p.textContent=t;el.append(h,p);detail.append(el)});});});
const flows=[
{edges:[['evidence','review','top','①']],text:'① 材料 → 识别与核验：上传原件和基础数据，AI 生成字段候选；经办人核对原文、归宗信息、缴费及减免。'},
{edges:[['review','rent','right','②']],text:'② 核验 → 核算预览：关联同宗历史合同，按已核对要素计算应缴、实缴与差额。付款未确认时，只能预览应缴，不能把实缴当作零。'},
{edges:[['rent','parcel','middle','③']],text:'③ 核算 → 一宗一档：经办人核对计算结果并确认发布，系统归集合同链，形成新的正式台账版本；归宗冲突或未决字段会阻断入账。'},
{edges:[['parcel','output','lower','④']],text:'④ 台账 → 提醒与输出：基于正式台账生成到期、欠缴提醒及报表。催缴通知须审核；生成税务单不等于已对接税务系统。'},
{edges:[['output','events','bottom','⑤'],['events','rent','lower','↩']],text:'⑤ 提醒 → 业务办理 → 重算：收款、终止有新依据后，预览并确认重算，形成新台账；续期先生成草稿，签署材料再回到导入核验。催缴标记不代替收款入账。'},
{edges:[['review','evidence','top','↩']],text:'↩ 核验 → 补件 → 重新核验：缺页、原文不清或事实冲突时挂起，补充材料后重新核对。高置信度也不能跳过人工确认。'}
];let step=0;
const ns='http://www.w3.org/2000/svg';
const draw=()=>{
const box=root.querySelector('.map').getBoundingClientRect();
const bounds=el=>{const r=el.getBoundingClientRect();return {x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height,cx:r.left+r.width/2-box.left,cy:r.top+r.height/2-box.top}};
const c=bounds(root.querySelector('.center'));const nodes={};let d='';
root.querySelectorAll('.branch').forEach(b=>{let r=bounds(b);nodes[b.dataset.key]=r;d+=`M${c.cx},${c.cy} Q${r.cx},${c.cy} ${r.cx},${r.cy} `;b.dataset.active=String(flows[step].edges.some(e=>e[0]===b.dataset.key||e[1]===b.dataset.key))});
root.querySelector('.structure').setAttribute('d',d);const group=root.querySelector('.routes');group.replaceChildren();
flows[step].edges.forEach(([from,to,route,label])=>{
const a=nodes[from],b=nodes[to];let path,lx,ly;
if(route==='top'||route==='bottom'){let top=route==='top';let sy=top?a.y-7:a.y+a.h+7,ey=top?b.y-7:b.y+b.h+7;let y=top?12:box.height-12;path=`M${a.cx},${sy} C${a.cx},${y} ${b.cx},${y} ${b.cx},${ey}`;lx=(a.cx+b.cx)/2;ly=top?y+3:y-2;}
else if(route==='right'){let x=box.width-6;path=`M${a.x+a.w+7},${a.cy} C${x},${a.cy} ${x},${b.cy} ${b.x+b.w+7},${b.cy}`;lx=x-5;ly=(a.cy+b.cy)/2;}
else {let y=route==='middle'?(nodes.review.y+nodes.review.h+nodes.rent.y)/2:(nodes.rent.y+nodes.rent.h+nodes.output.y)/2;let sy=a.cy<y?a.y+a.h+7:a.y-7,ey=b.cy<y?b.y+b.h+7:b.y-7;path=`M${a.cx},${sy} C${a.cx},${y} ${a.cx},${y} ${(a.cx+b.cx)/2},${y} S${b.cx},${y} ${b.cx},${ey}`;lx=(a.cx+b.cx)/2;ly=y-7;}
let p=document.createElementNS(ns,'path');p.setAttribute('class','route');p.setAttribute('d',path);group.append(p);let t=document.createElementNS(ns,'text');t.setAttribute('x',lx);t.setAttribute('y',ly);t.setAttribute('text-anchor','middle');t.textContent=label;group.append(t);
});root.querySelector('.flow-caption').textContent=flows[step].text;
};
